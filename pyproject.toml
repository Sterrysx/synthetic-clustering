[project]
name = "synthclust"
version = "1.0.0"
description = "Downstream utility of CART-synthesised data for clustering: a factorial evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "pyarrow>=17.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
run-clustering    = "synthclust.run_clustering:main"
recompute-metrics = "synthclust.recompute_metrics:main"
make-figures      = "synthclust.make_figures:main"
make-supp-table   = "synthclust.make_supp_table:main"
convert-codec     = "synthclust.convert_codec:main"
verify-data       = "synthclust.verify_data:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synthclust"]
